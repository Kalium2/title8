name: Scrape Title 8

# Run by hand from the Actions tab ("Run workflow"). The scraped data is
# committed back to the branch the run was started on, and also attached
# to the run as a downloadable file.
on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Only these section numbers, space separated (blank = all of Title 8)"
        required: false
        default: ""
      max_pages:
        description: "Stop after this many pages (0 = no limit; try 50 for a trial run)"
        required: false
        default: "0"
      reuse_pages:
        description: "Re-read the pages saved by the last run instead of downloading them again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-title8
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the scraper
        run: python -m unittest discover -s tests -v

      # Downloaded pages are saved after every run. They are only read back
      # when reuse_pages is ticked; otherwise every page is fetched fresh.
      - name: Restore saved pages
        if: inputs.reuse_pages
        uses: actions/cache/restore@v4
        with:
          path: .cache/title8
          key: title8-pages-${{ github.run_id }}
          restore-keys: title8-pages-

      - name: Scrape
        env:
          SECTIONS: ${{ inputs.sections }}
          MAX_PAGES: ${{ inputs.max_pages }}
          REUSE: ${{ inputs.reuse_pages }}
        run: |
          args=(--out data --max-pages "${MAX_PAGES:-0}")
          if [ -n "$SECTIONS" ]; then args+=(--section $SECTIONS); fi
          if [ "$REUSE" != "true" ]; then args+=(--refresh); fi
          python title8_scraper.py "${args[@]}"

      - name: Save downloaded pages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/title8
          key: title8-pages-${{ github.run_id }}

      - name: Attach data to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title8-data
          path: data/
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to the data."
          else
            git commit -m "Update Title 8 data ($(jq -r .sections data/crawl_report.json) sections)"
            git push
          fi
